<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10B981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>项目管理系统</title>
    <link rel="icon" href="/static/icons/app-icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/app-icon-192.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="mobile-app-bar">
    <button class="mobile-nav-toggle" type="button" aria-label="打开导航" aria-expanded="false">☰</button>
    <span class="mobile-app-title">星轨</span>
</header>
<div class="app-layout">
    <!-- ── 侧边栏 ─────────────────────────────────── -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>
                <img class="app-logo" src="/static/icons/app-icon.svg" alt="" aria-hidden="true">
                项目管理系统
            </h1>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">概览</div>
                <a class="nav-item active" data-page="dashboard" href="#">
                    <span class="icon">📊</span> 仪表盘
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">项目管理</div>
                <a class="nav-item" data-page="projects" href="#">
                    <span class="icon">📁</span> 项目登记
                </a>
                <a class="nav-item" data-page="files" href="#">
                    <span class="icon">📎</span> 立项文件库
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">设计管理</div>
                <a class="nav-item" data-page="requirements" href="#">
                    <span class="icon">📝</span> 需求管理
                </a>
                <a class="nav-item" data-page="drawings" href="#">
                    <span class="icon">📐</span> 图纸管理
                </a>
                <a class="nav-item" data-page="bom" href="#">
                    <span class="icon">🔧</span> BOM管理
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">流程</div>
                <a class="nav-item" data-page="approvals" href="#">
                    <span class="icon">✅</span> 审批中心
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">系统</div>
                <a class="nav-item" data-page="users" href="#">
                    <span class="icon">👥</span> 用户管理
                </a>
                <a class="nav-item" data-page="settings" href="#">
                    <span class="icon">⚙️</span> 系统设置
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">{{ session.real_name[0] if session.real_name else 'U' }}</div>
                <div class="user-meta">
                    <div class="user-name">{{ session.real_name or session.username }}</div>
                    <div class="user-role">{{ session.role }}</div>
                </div>
                <a href="/logout" class="btn btn-sm btn-icon" title="退出">🚪</a>
            </div>
        </div>
    </aside>

    <!-- ── 主内容区 ───────────────────────────────── -->
    <main class="main-content">
        <div id="page-content">
            <!-- 动态内容由 JS 渲染 -->
            <div class="loading"><div class="spinner"></div>加载中...</div>
        </div>
    </main>
</div>

<div class="toast-container"></div>

<!-- ── 通用模态框 ─────────────────────────────────── -->
<div class="modal-overlay" id="modal-main">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-title">标题</h2>
            <button class="modal-close" onclick="hideModal('modal-main')">&times;</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
    </div>
</div>

<script src="/static/js/app.js"></script>
<script src="/static/js/pwa.js"></script>
<script>
// ── 仪表盘 ──────────────────────────────────────────────────
registerPage('dashboard', async (el) => {
    const stats = await api('/api/dashboard/stats');
    if (!stats) return;

    const today = new Date().toLocaleDateString('zh-CN', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });

    el.innerHTML = `
        <div class="page-header">
            <div class="greeting">👋 欢迎回来，{{ session.real_name or session.username }}</div>
            <div class="date">${today}</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card accent">
                <div class="stat-label">📁 进行中项目</div>
                <div class="stat-value">${stats.projects_active}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📋 总项目数</div>
                <div class="stat-value">${stats.projects_total}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📝 需求总数</div>
                <div class="stat-value">${stats.reqs_total}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⏳ 待审批</div>
                <div class="stat-value">${stats.pending_approvals}</div>
            </div>
        </div>

        <div class="two-col">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">⚡ 快捷入口</span>
                </div>
                <div class="card-body">
                    <div class="quick-grid">
                        <div class="quick-card" onclick="navigateTo('projects')">
                            <div class="quick-icon">📁</div>
                            <div class="quick-text"><h3>项目登记</h3><p>创建和管理项目</p></div>
                        </div>
                        <div class="quick-card" onclick="navigateTo('requirements')">
                            <div class="quick-icon">📝</div>
                            <div class="quick-text"><h3>需求管理</h3><p>管理项目需求</p></div>
                        </div>
                        <div class="quick-card" onclick="navigateTo('drawings')">
                            <div class="quick-icon">📐</div>
                            <div class="quick-text"><h3>图纸管理</h3><p>图纸版本控制</p></div>
                        </div>
                        <div class="quick-card" onclick="navigateTo('bom')">
                            <div class="quick-icon">🔧</div>
                            <div class="quick-text"><h3>BOM管理</h3><p>物料清单管理</p></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">📜 最近操作</span>
                </div>
                <div class="card-body">
                    ${stats.recent_activity.length ? stats.recent_activity.map(a => `
                        <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
                            <div style="flex:1">
                                <div style="font-size:13px;font-weight:500">${a.action}</div>
                                <div style="font-size:12px;color:var(--text-muted)">${a.details || ''}</div>
                            </div>
                            <div style="font-size:12px;color:var(--text-muted);white-space:nowrap">${formatDateTime(a.timestamp)}</div>
                        </div>
                    `).join('') : '<div class="empty-state"><p>暂无操作记录</p></div>'}
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">📐 图纸总数</div>
                <div class="stat-value">${stats.drawings_total}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🔧 BOM总数</div>
                <div class="stat-value">${stats.boms_total}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📋 总项目数</div>
                <div class="stat-value">${stats.projects_total}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">✅ 已完成项目</div>
                <div class="stat-value">${stats.projects_total - stats.projects_active}</div>
            </div>
        </div>
    `;
});

// ── 项目管理 ──────────────────────────────────────────────────
registerPage('projects', async (el) => {
    const projects = await api('/api/projects');
    if (!projects) return;

    el.innerHTML = `
        <div class="page-header">
            <div class="greeting">📁 项目登记</div>
            <div class="date">管理所有项目信息</div>
        </div>

        <div class="toolbar">
            <div class="toolbar-left">
                <input type="text" class="search-input" placeholder="搜索项目名称或编号..." id="project-search">
            </div>
            <div class="toolbar-right">
                <button class="btn btn-primary" onclick="showCreateProject()">+ 新建项目</button>
            </div>
        </div>

        <div class="card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>项目编号</th>
                            <th>项目名称</th>
                            <th>客户</th>
                            <th>类型</th>
                            <th>项目经理</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="projects-tbody">
                        ${projects.map(p => `
                            <tr>
                                <td style="font-weight:500;color:var(--accent)">${p.project_number}</td>
                                <td>${p.project_name}</td>
                                <td>${p.customer || '-'}</td>
                                <td><span class="badge badge-info">${p.type || '-'}</span></td>
                                <td>${p.manager_name || '-'}</td>
                                <td><span class="badge ${getBadgeClass(p.status)}">${p.status}</span></td>
                                <td>${formatDate(p.created_at)}</td>
                                <td class="actions">
                                    <button class="btn btn-sm" onclick="navigateTo('project-detail', {id:${p.id}})">查看</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteProject(${p.id})">删除</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
            ${projects.length === 0 ? '<div class="empty-state"><div class="icon">📁</div><p>暂无项目，点击上方按钮创建</p></div>' : ''}
        </div>
    `;

    // 搜索
    $('#project-search').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        $$('#projects-tbody tr').forEach(tr => {
            tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
    });
});

function showCreateProject() {
    const types = ['研发', '生产', '外包', '内部'];
    const statusList = ['进行中', '已暂停', '已完成'];

    $('#modal-title').textContent = '新建项目';
    $('#modal-body').innerHTML = `
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">项目类型</label>
                <select class="form-select" id="p-type" onchange="previewProjectNumber()">
                    ${types.map(t => `<option value="${t}">${t}</option>`).join('')}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">项目编号</label>
                <div style="display:flex;gap:8px">
                    <input type="text" class="form-input" id="p-number" readonly placeholder="点击生成">
                    <button class="btn btn-primary" onclick="previewProjectNumber()" type="button">生成</button>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">项目名称 *</label>
            <input type="text" class="form-input" id="p-name" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">客户</label>
                <input type="text" class="form-input" id="p-customer">
            </div>
            <div class="form-group">
                <label class="form-label">预算 (元)</label>
                <input type="number" class="form-input" id="p-budget" value="0">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">开始日期</label>
                <input type="date" class="form-input" id="p-start">
            </div>
            <div class="form-group">
                <label class="form-label">结束日期</label>
                <input type="date" class="form-input" id="p-end">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">项目经理</label>
            <select class="form-select" id="p-manager">
                <option value="">-- 请选择 --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">项目描述</label>
            <textarea class="form-textarea" id="p-desc"></textarea>
        </div>
    `;
    $('#modal-footer').innerHTML = `
        <button class="btn" onclick="hideModal('modal-main')">取消</button>
        <button class="btn btn-primary" onclick="createProject()">创建</button>
    `;
    showModal('modal-main');
    // 自动生成项目号
    previewProjectNumber();

    // 加载项目经理列表
    api('/api/users').then(users => {
        if (!users) return;
        const sel = $('#p-manager');
        users.filter(u => u.is_active && ['项目经理', '项目管理员', '系统管理员'].includes(u.role))
            .forEach(u => {
                sel.innerHTML += `<option value="${u.id}">${u.real_name} (${u.role})</option>`;
            });
    });
}

async function previewProjectNumber() {
    const type = $('#p-type').value;
    const res = await api('/api/projects/generate-number', {
        method: 'POST', body: { type }
    });
    if (res) $('#p-number').value = res.project_number;
}

async function createProject() {
    const data = {
        project_number: $('#p-number').value,
        project_name: $('#p-name').value,
        customer: $('#p-customer').value,
        type: $('#p-type').value,
        manager_id: $('#p-manager').value || null,
        start_date: $('#p-start').value,
        end_date: $('#p-end').value,
        budget: parseFloat($('#p-budget').value) || 0,
        description: $('#p-desc').value
    };
    if (!data.project_name) { toast('请输入项目名称', 'error'); return; }
    if (!data.project_number) { toast('请先生成项目编号', 'error'); return; }

    const res = await api('/api/projects', { method: 'POST', body: data });
    if (res && res.success) {
        toast('项目创建成功');
        hideModal('modal-main');
        navigateTo('projects');
    }
}

async function deleteProject(id) {
    if (!confirm('确定删除该项目？')) return;
    const res = await api(`/api/projects/${id}`, { method: 'DELETE' });
    if (res && res.success) {
        toast('项目已删除');
        navigateTo('projects');
    }
}

// ── 项目详情 ──────────────────────────────────────────────────
registerPage('project-detail', async (el, params) => {
    const pid = params.id;
    const project = await api(`/api/projects/${pid}`);
    if (!project) return;

    el.innerHTML = `
        <div class="page-header">
            <div style="display:flex;align-items:center;gap:12px">
                <button class="btn btn-sm" onclick="navigateTo('projects')">← 返回</button>
                <div>
                    <div class="greeting">${project.project_number} - ${project.project_name}</div>
                    <div class="date">
                        <span class="badge ${getBadgeClass(project.status)}">${project.status}</span>
                        &nbsp; 客户: ${project.customer || '-'} &nbsp; 类型: ${project.type || '-'}
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">项目经理</div>
                <div class="stat-value" style="font-size:18px">${project.manager_name || '-'}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">预算</div>
                <div class="stat-value" style="font-size:18px">¥${(project.budget || 0).toLocaleString()}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">开始日期</div>
                <div class="stat-value" style="font-size:18px">${project.start_date || '-'}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">结束日期</div>
                <div class="stat-value" style="font-size:18px">${project.end_date || '-'}</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchProjectTab(this, 'files', ${pid})">📎 立项文件</div>
            <div class="tab" onclick="switchProjectTab(this, 'reqs', ${pid})">📝 需求</div>
            <div class="tab" onclick="switchProjectTab(this, 'draws', ${pid})">📐 图纸</div>
            <div class="tab" onclick="switchProjectTab(this, 'boms', ${pid})">🔧 BOM</div>
        </div>
        <div id="project-tab-content"></div>
    `;

    switchProjectTab(el.querySelector('.tab.active'), 'files', pid);
});

async function switchProjectTab(tabEl, tab, pid) {
    $$('.tab').forEach(t => t.classList.remove('active'));
    tabEl.classList.add('active');
    const content = $('#project-tab-content');

    if (tab === 'files') {
        const files = await api(`/api/projects/${pid}/files`);
        content.innerHTML = `
            <div class="dropzone" id="detail-dropzone"
                 ondragover="event.preventDefault();this.classList.add('dragover')"
                 ondragleave="this.classList.remove('dragover')"
                 ondrop="handleDrop(event, ${pid})"
                 onclick="uploadProjectFiles(${pid})"
                 style="margin-bottom:16px;padding:24px">
                <div class="icon" style="font-size:24px">📄</div>
                <p style="font-size:13px;font-weight:500">点击或拖拽文件到此处上传</p>
                <p style="font-size:11px;color:var(--text-muted)">支持 PDF、Office、图片等格式</p>
            </div>
            <div class="toolbar">
                <div class="toolbar-left">
                    <select class="form-select" style="width:160px" onchange="filterProjectFiles(${pid}, this.value)">
                        <option value="">全部类别</option>
                        <option value="立项文件">立项文件</option>
                        <option value="合同文件">合同文件</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>文件名</th><th>版本</th><th>类别</th><th>上传者</th><th>上传时间</th><th>操作</th></tr></thead>
                        <tbody id="files-tbody">
                            ${(files || []).map(f => `
                                <tr>
                                    <td>${f.file_name}</td>
                                    <td><span class="badge badge-info">V${f.version}</span></td>
                                    <td>${f.category}</td>
                                    <td>${f.uploader_name || '-'}</td>
                                    <td>${formatDateTime(f.upload_time)}</td>
                                    <td class="actions">
                                        <button class="btn btn-sm" onclick="previewFile(${f.id}, '${f.file_name}')">查看</button>
                                        <a class="btn btn-sm" href="/api/files/${f.id}/download">下载</a>
                                        <button class="btn btn-sm btn-danger" onclick="deleteFile(${f.id}, ${pid})">删除</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                ${!files || files.length === 0 ? '<div class="empty-state"><div class="icon">📎</div><p>暂无文件</p></div>' : ''}
            </div>
        `;
    } else if (tab === 'reqs') {
        const reqs = await api(`/api/projects/${pid}/requirements`);
        content.innerHTML = `
            <div class="toolbar">
                <div class="toolbar-right">
                    <button class="btn btn-primary" onclick="showCreateReq(${pid})">+ 新建需求</button>
                </div>
            </div>
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>需求ID</th><th>标题</th><th>需求人</th><th>需求时间</th><th>优先级</th><th>状态</th><th>版本</th><th>创建者</th><th>操作</th></tr></thead>
                        <tbody>
                            ${(reqs || []).map(r => `
                                <tr>
                                    <td style="font-weight:500;color:var(--accent)">${r.req_id}</td>
                                    <td>${r.title}</td>
                                    <td>${r.requester_name || r.creator_name || '-'}</td>
                                    <td>${r.requirement_time ? formatDate(r.requirement_time) : '-'}</td>
                                    <td><span class="badge ${r.priority === '高' ? 'badge-danger' : r.priority === '中' ? 'badge-warning' : 'badge-gray'}">${r.priority}</span></td>
                                    <td><span class="badge ${getBadgeClass(r.status)}">${r.status}</span></td>
                                    <td>V${r.version}</td>
                                    <td>${r.creator_name || '-'}</td>
                                    <td class="actions">
                                        <button class="btn btn-sm" onclick="showReqChanges(${r.id})">变更</button>
                                        ${(r.created_by === CURRENT_USER_ID || ['系统管理员','项目管理员'].includes(CURRENT_USER_ROLE)) ? `<button class="btn btn-sm btn-danger" onclick="deleteReq(${r.id}, ${pid})">删除</button>` : ''}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                ${!reqs || reqs.length === 0 ? '<div class="empty-state"><div class="icon">📝</div><p>暂无需求</p></div>' : ''}
            </div>
        `;
    } else if (tab === 'draws') {
        const draws = await api(`/api/projects/${pid}/drawings`);
        content.innerHTML = `
            <div class="toolbar">
                <div class="toolbar-right">
                    <button class="btn btn-primary" onclick="showCreateDrawing(${pid})">+ 上传图纸</button>
                </div>
            </div>
            <!-- 拖拽上传区 -->
            <div class="card" style="margin-bottom:16px">
                <div class="card-body">
                    <div class="dropzone" id="detail-drawing-dropzone"
                         style="padding:20px"
                         ondragover="event.preventDefault();this.classList.add('dragover')"
                         ondragleave="this.classList.remove('dragover')"
                         ondrop="handleDrawingDrop(event, ${pid})"
                         onclick="triggerDrawingUpload(${pid})">
                        <div class="icon" style="font-size:24px">📄</div>
                        <p style="font-size:13px;font-weight:500">点击或拖拽图纸文件到此处上传</p>
                        <p style="font-size:11px;color:var(--text-muted)">支持 PDF、DWG、STP、DXF 格式</p>
                    </div>
                    <input type="file" id="drawing-file-input" multiple
                           accept=".pdf,.dwg,.stp,.step,.dxf" style="display:none"
                           onchange="handleDrawingFileSelect(this, ${pid})">
                </div>
            </div>
            <div class="card">
                <div class="card-header">

async function doUpload(files, pid) {
    const formData = new FormData();
    formData.append('category', '立项文件');

    const res = await fetch(`/api/projects/${pid}/files/upload`, {
        method: 'POST', body: formData
    });
    const data = await res.json();
    if (data.success) {

function previewDrawing(did, filePath, drawingName) {
    const ext = filePath.split('.').pop().toLowerCase();
    const previewUrl = `/api/drawings/${did}/preview`;

    if (ext === 'pdf') {
        // PDF: 新标签页查看
        window.open(previewUrl, '_blank');
    } else if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(ext)) {
        // 图片: 弹窗查看
        $('#modal-title').textContent = drawingName;
        $('#modal-body').innerHTML = `<div style="text-align:center"><img src="${previewUrl}" style="max-width:100%;max-height:70vh;border-radius:var(--radius)"></div>`;
        $('#modal-footer').innerHTML = `<a class="btn" href="/api/drawings/${did}/download">下载原文件</a> <button class="btn" onclick="hideModal('modal-main')">关闭</button>`;
        showModal('modal-main');
    } else if (['dwg', 'stp', 'step', 'dxf'].includes(ext)) {
        // DWG/STP: 提供下载（浏览器无法直接渲染）
        $('#modal-title').textContent = `图纸预览 - ${drawingName}`;
        $('#modal-body').innerHTML = `
            <div style="text-align:center;padding:24px">
                <div style="font-size:48px;margin-bottom:16px">📐</div>
                <h3 style="margin-bottom:8px">${drawingName}</h3>
                <p style="color:var(--text-muted);margin-bottom:4px">文件格式: <strong>${ext.toUpperCase()}</strong></p>
                <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px">
                    ${ext === 'dwg' ? 'DWG 格式需要使用 AutoCAD 或兼容软件打开' : 'STP/STEP 格式需要使用 3D CAD 软件打开'}
                </p>
                <a class="btn btn-primary" href="/api/drawings/${did}/download" style="margin-right:8px">⬇ 下载文件</a>
            </div>
        `;
        $('#modal-footer').innerHTML = `<button class="btn" onclick="hideModal('modal-main')">关闭</button>`;
        showModal('modal-main');
    } else {
        // 其他格式: 尝试新标签页
        window.open(previewUrl, '_blank');
    }
}

function triggerDrawingUpload(pid) {

    if (input.files.length > 0) {
        batchUploadDrawings(input.files, pid);

}

function handleDrawingDrop(event, pid) {
    event.preventDefault();
    event.target.classList.remove('dragover');
    const files = event.dataTransfer.files;
    if (files.length > 0) {
        batchUploadDrawings(files, pid);
    }
}

async function batchUploadDrawings(fileList, pid) {
    let successCount = 0;
    let failCount = 0;
    for (const file of fileList) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['pdf', 'dwg', 'stp', 'step', 'dxf'].includes(ext)) {
            toast(`跳过不支持的格式: ${file.name}`, 'warning');
            failCount++;
            continue;
        }
        const drawingName = file.name.replace(/\.[^.]+$/, '');
        const formData = new FormData();
        formData.append('drawing_number', `DWG-${Date.now()}-${successCount}`);
        formData.append('drawing_name', drawingName);
        formData.append('file', file);

        const res = await fetch(`/api/projects/${pid}/drawings`, {
            method: 'POST', body: formData
        });
        const data = await res.json();
        if (data.success) {
            successCount++;
        } else {
            toast(`${file.name}: ${data.error || '上传失败'}`, 'error');
            failCount++;
        }
    }
    if (successCount > 0) {
        toast(`成功上传 ${successCount} 个图纸文件`);
        filterDrawings();
    }
}

function searchBOMItems(query) {
    const q = query.toLowerCase();
    $$('#bom-items-tbody tr').forEach(tr => {
        const name = (tr.dataset.name || '').toLowerCase();
        const code = (tr.dataset.code || '').toLowerCase();
        tr.style.display = (name.includes(q) || code.includes(q)) ? '' : 'none';
    });
}

async function addBOMItemAndContinue(bid) {
    const success = await doAddBOMItem(bid);
    if (success) {
        // 清空表单继续添加
        $('#bi-name').value = '';
        $('#bi-spec').value = '';
        $('#bi-qty').value = '1';
        $('#bi-pos').value = '';
        $('#bi-mat').value = '';
        $('#bi-name').focus();
    }
}

async function doAddBOMItem(bid) {
    const data = {
        material_code: $('#bi-code').value,
        name: $('#bi-name').value,
        spec: $('#bi-spec').value,
        unit: $('#bi-unit').value,
        quantity: parseFloat($('#bi-qty').value) || 1,
        position: $('#bi-pos').value,
        material: $('#bi-mat').value
    };
    if (!data.name) { toast('请输入物料名称', 'error'); return false; }
    const res = await api(`/api/boms/${bid}/items`, { method: 'POST', body: data });
    if (res && res.success) {
        toast('物料添加成功');
        return true;
    }
    return false;
}

async function addBOMItem(bid) {
    const success = await doAddBOMItem(bid);
    if (success) {
        hideModal('modal-main');
        navigateTo('bom-detail', { id: bid });

}

async function doImportBOM(pid) {
    const fileInput = $('#bom-import-file');
    if (!fileInput.files[0]) { toast('请选择文件', 'error'); return; }

    const version = $('#bom-import-version').value || 'V1.0';
    // 先创建BOM
    const bomRes = await api(`/api/projects/${pid}/boms`, { method: 'POST', body: { version } });
    if (!bomRes || !bomRes.success) return;

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    const res = await fetch(`/api/boms/${bomRes.id}/import`, {
        method: 'POST', body: formData
    });
    const data = await res.json();
    if (data.success) {
        toast(`导入成功: ${data.imported} 条物料`);
        hideModal('modal-main');
        navigateTo('bom-detail', { id: bomRes.id });
    } else {
        toast(data.error || '导入失败', 'error');
    }
}

async function doImportBOMToVersion(bid) {
    const fileInput = $('#bom-import-file');
    if (!fileInput.files[0]) { toast('请选择文件', 'error'); return; }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    const res = await fetch(`/api/boms/${bid}/import`, {
        method: 'POST', body: formData
    });
    const data = await res.json();
    if (data.success) {
        toast(`导入成功: ${data.imported} 条物料`);
        hideModal('modal-main');
        navigateTo('bom-detail', { id: bid });
    } else {
        toast(data.error || '导入失败', 'error');
    }
}

registerPage('approvals', async (el) => {

        </div>
        <div id="approval-content">
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>类型</th><th>标题</th><th>提交时间</th><th>操作</th></tr></thead>
                        <tbody>
                            ${(pending || []).map(p => `
                                <tr>
                                    <td><span class="badge badge-warning">${p.type === 'req_change' ? '需求变更' : '图纸ECO'}</span></td>
                                    <td>${p.title}</td>
                                    <td>${formatDateTime(p.created_at)}</td>

                                        <button class="btn btn-sm btn-danger" onclick="rejectItem('${p.type}', ${p.id})">驳回</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                ${!pending || pending.length === 0 ? '<div class="empty-state"><div class="icon">✅</div><p>暂无待审批事项</p></div>' : ''}
            </div>
        </div>
    `;

    window._approvalHistory = history;
});

function showApprovalTab(tabEl, tab) {
    $$('.tab').forEach(t => t.classList.remove('active'));
    tabEl.classList.add('active');
    const content = $('#approval-content');

    if (tab === 'pending') {
        navigateTo('approvals');
    } else {
        const history = window._approvalHistory || [];
        content.innerHTML = `
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>类型</th><th>ID</th><th>审批人</th><th>决定</th><th>意见</th><th>时间</th></tr></thead>
                        <tbody>
                            ${history.map(h => `
                                <tr>
                                    <td>${h.target_type}</td>
                                    <td>${h.target_id}</td>
                                    <td>${h.approver_name || '-'}</td>
                                    <td><span class="badge ${h.decision === '通过' ? 'badge-success' : 'badge-danger'}">${h.decision}</span></td>
                                    <td>${h.comment || '-'}</td>
                                    <td>${formatDateTime(h.decided_at)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                ${history.length === 0 ? '<div class="empty-state"><p>暂无审批记录</p></div>' : ''}
            </div>
        `;
    }
}

function approveItem(type, id) {
    doApproval(type, id, '通过');
}

function rejectItem(type, id) {
    doApproval(type, id, '驳回');
}

async function doApproval(type, id, decision) {
    const comment = prompt(`请输入审批意见 (${decision}):`, '');
    if (comment === null) return;
    const res = await api(`/api/approvals/${type}/${id}`, {
        method: 'POST',
        body: { decision, comment }
    });
    if (res && res.success) {
        toast(`已${decision}`);
        navigateTo('approvals');
    }
}

async function doRestore(input) {
    if (!input.files[0]) return;
    if (!confirm('恢复将覆盖当前数据，确定继续？')) { input.value = ''; return; }
    const formData = new FormData();
    formData.append('backup', input.files[0]);
    const res = await fetch('/api/settings/restore', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.success) {
        toast('恢复成功，即将刷新页面');
        setTimeout(() => location.reload(), 1500);
    } else {
        toast(data.error || '恢复失败', 'error');
    }
    input.value = '';
}

// ── 文件筛选辅助 ──────────────────────────────────────────────
async function filterProjectFiles(pid, category) {
    const files = await api(`/api/projects/${pid}/files?category=${category}`);
    const tbody = $('#files-tbody');
    if (!tbody) return;
    tbody.innerHTML = (files || []).map(f => `
        <tr>
            <td>${f.file_name}</td>
            <td><span class="badge badge-info">V${f.version}</span></td>
            <td>${f.category}</td>
            <td>${f.uploader_name || '-'}</td>
            <td>${formatDateTime(f.upload_time)}</td>
            <td class="actions">
                <button class="btn btn-sm" onclick="previewFile(${f.id}, '${f.file_name}')">查看</button>
                <a class="btn btn-sm" href="/api/files/${f.id}/download">下载</a>
                <button class="btn btn-sm btn-danger" onclick="deleteFile(${f.id}, ${pid})">删除</button>
            </td>
        </tr>
    `).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--text-muted)">暂无文件</td></tr>';
}

// ── 文件预览 ──────────────────────────────────────────────────
function previewFile(fid, fileName) {
    const ext = fileName.split('.').pop().toLowerCase();
    const previewUrl = `/api/files/${fid}/preview`;

    if (ext === 'pdf') {
        // PDF：新标签页内嵌查看
        window.open(previewUrl, '_blank');
    } else if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(ext)) {
        // 图片：弹窗查看
        $('#modal-title').textContent = fileName;
        $('#modal-body').innerHTML = `<div style="text-align:center"><img src="${previewUrl}" style="max-width:100%;max-height:70vh;border-radius:var(--radius)"></div>`;
        $('#modal-footer').innerHTML = `<a class="btn" href="/api/files/${fid}/download">下载原文件</a> <button class="btn" onclick="hideModal('modal-main')">关闭</button>`;
        showModal('modal-main');
    } else {
        // 其他文件：新标签页尝试查看
        window.open(previewUrl, '_blank');
    }
}
